name: Livo
options:
  bundleIdPrefix: com.livo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Single source of truth for identifiers: the TestFlight workflow overrides it with your own bundle ID.
    APP_BUNDLE_ID: com.livo.app
targets:
  Livo:
    type: application
    platform: iOS
    sources:
      - path: Livo
        excludes: ["Resources/PrivacyInfo.xcprivacy"]
      - path: Livo/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: LivoWidgets
    info:
      # Generated by XcodeGen and merged with the INFOPLIST_KEY_* settings below.
      path: Livo/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.livo.app.refresh]
        UIBackgroundModes: [fetch, remote-notification]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        LivoAppGroup: group.$(APP_BUNDLE_ID)
        LivoCloudContainer: iCloud.$(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: livo
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: "O livo usa o Face ID para proteger seus dados quando o bloqueio está ativado."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "O livo lê passos, sono, exercícios, água, peso e frequência cardíaca do app Saúde para mostrar sua evolução. Nada é alterado no app Saúde."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "O livo mostra seus próximos compromissos no painel e pode criar tarefas de preparação. Os eventos não são copiados nem enviados."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "O livo envia ao app Lembretes as tarefas que você escolher."
        CODE_SIGN_ENTITLEMENTS: Livo/Livo.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  LivoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LivoWidgets
      - path: Livo/Shared
      - path: Livo/Core/Money.swift
      - path: Livo/Core/DesignSystem.swift
      - path: Livo/Core/LivoMark.swift
      - path: Livo/Core/LivoMarkGeometry.swift
    info:
      path: LivoWidgets/Info.plist
      properties:
        CFBundleDisplayName: livo
        LivoAppGroup: group.$(APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        CODE_SIGN_ENTITLEMENTS: LivoWidgets/LivoWidgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  LivoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LivoTests]
    dependencies:
      - target: Livo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Livo:
    build:
      targets:
        Livo: all
    test:
      targets: [LivoTests]

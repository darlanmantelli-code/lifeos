name: Livo
options:
  bundleIdPrefix: com.livo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Livo:
    type: application
    platform: iOS
    sources:
      - path: Livo
        excludes: ["Resources/PrivacyInfo.xcprivacy"]
      - path: Livo/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livo.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: livo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: "O livo usa o Face ID para proteger seus dados quando o bloqueio está ativado."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  LivoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LivoTests]
    dependencies:
      - target: Livo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Livo:
    build:
      targets:
        Livo: all
    test:
      targets: [LivoTests]
